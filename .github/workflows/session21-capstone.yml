name: Session 21 TaskBoard Capstone

on:
  push:
    paths:
      - "session21-python/**"
      - ".github/workflows/session21-capstone.yml"
  pull_request:
    paths:
      - "session21-python/**"
      - ".github/workflows/session21-capstone.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: session21-python/backend
      - name: Run backend tests
        run: pytest -q
        working-directory: session21-python/backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
        working-directory: session21-python/frontend
      - name: Build frontend
        run: npm run build
        working-directory: session21-python/frontend

  sast:
    name: Static analysis - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v3

  sca:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
        working-directory: session21-python/backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit frontend dependencies
        run: |
          npm install
          npm audit --audit-level=high
        working-directory: session21-python/frontend

  secret-scan:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Build, scan and deliver images
    needs: [test, sast, sca, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -t taskboard-backend:${{ github.sha }} ./session21-python/backend
          docker build -t taskboard-frontend:${{ github.sha }} ./session21-python/frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: taskboard-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: taskboard-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Publish images to GHCR on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag taskboard-backend:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }}
          docker tag taskboard-frontend:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }}

  deploy:
    name: Optional Helm deployment
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.TASKBOARD_DEPLOY_ENABLED == 'true'
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA must be configured before deployment."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Create application credentials
        env:
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          if [ -z "$POSTGRES_USERNAME" ] || [ -z "$POSTGRES_PASSWORD" ] \
            || [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_READ_TOKEN" ]; then
            echo "Postgres and GHCR deployment secrets must be configured."
            exit 1
          fi
          kubectl create namespace taskboard --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic taskboard-postgres-credentials \
            --namespace taskboard \
            --from-literal=username="$POSTGRES_USERNAME" \
            --from-literal=password="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace taskboard \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_READ_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy and verify
        run: |
          helm upgrade --install taskboard ./session21-python/helm/taskboard \
            --namespace taskboard \
            --set backend.image=ghcr.io/${{ github.repository_owner }}/taskboard-backend \
            --set backend.tag=${{ github.sha }} \
            --set frontend.image=ghcr.io/${{ github.repository_owner }}/taskboard-frontend \
            --set frontend.tag=${{ github.sha }} \
            --set 'imagePullSecrets[0].name=ghcr-pull-secret'
          kubectl rollout status deployment/taskboard-taskboard-backend --namespace taskboard --timeout=180s
          kubectl rollout status deployment/taskboard-frontend --namespace taskboard --timeout=180s
